[project]
name = "augmented-mcqa"
version = "0.1.0"
description = "Augmented MCQA generation and evaluation tooling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==0.71.0",
    "datasets>=4.5.0",
    "google-genai>=1.63.0",
    "huggingface-hub>=0.34.0",
    "inspect-ai>=0.3.189",
    "matplotlib>=3.10.8",
    "numpy>=2.2",
    "openai>=2.26.0",
    "pandas>=3.0.0",
    "python-dotenv>=1.2.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
    "vllm>=0.10.1",
    "wrapt>=1.17.3",
    "pytest>=8.0.0",
]

[tool.uv]
cache-dir = "/fs/nexus-scratch/adesai10/uv-cache"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
